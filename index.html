<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AutoTrack Pro - Vehicle Maintenance</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: '#2563EB',
                        brandHover: '#1D4ED8',
                        danger: '#EF4444',
                        warning: '#F59E0B',
                        success: '#10B981',
                        surface: '#F8FAFC'
                    }
                }
            }
        }
    </script>

    <style>
        body {
            -webkit-font-smoothing: antialiased;
            background-color: #F1F5F9; /* Light mode default bg */
            color: #0F172A;
        }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

        .progress-bar-fill {
            transition: width 1s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.5s ease;
        }

        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; margin: 0; 
        }
        
        /* Hide scrollbar for tabs */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Modal Animation */
        .modal-active { opacity: 1; pointer-events: auto; }
        .modal-inactive { opacity: 0; pointer-events: none; }
        .modal-content-active { transform: scale(1); }
        .modal-content-inactive { transform: scale(0.95); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center">

    <main class="w-full max-w-md md:max-w-3xl lg:max-w-4xl flex-grow flex flex-col relative pb-20 md:pb-6 bg-white shadow-xl min-h-screen">
        
        <!-- Header -->
        <header class="p-4 flex justify-between items-center sticky top-0 bg-white/90 backdrop-blur-md z-30 border-b border-slate-200">
            <div>
                <h1 class="text-xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-emerald-500">
                    <i class="fa-solid fa-route mr-2 text-blue-600"></i>AutoTrack
                </h1>
                <p class="text-[10px] text-slate-500 mt-0.5" id="lblSubtitle">Manajer Kendaraan Pribadi</p>
            </div>
            <div class="flex gap-2">
                <!-- Lang Toggle -->
                <button onclick="toggleLang()" class="w-9 h-9 rounded-full bg-slate-50 shadow-sm flex items-center justify-center border border-slate-200 hover:bg-slate-100 transition text-sm font-bold text-slate-600" id="btnLang">
                    EN
                </button>
                <!-- Data Menu Toggle -->
                <div class="relative">
                    <button onclick="toggleDataMenu()" class="w-9 h-9 rounded-full bg-slate-50 shadow-sm flex items-center justify-center border border-slate-200 hover:bg-slate-100 transition text-slate-600">
                        <i class="fa-solid fa-ellipsis-vertical"></i>
                    </button>
                    <!-- Dropdown -->
                    <div id="dataMenu" class="absolute right-0 mt-2 w-48 bg-white rounded-xl shadow-xl border border-slate-200 hidden overflow-hidden z-50">
                        <button onclick="exportData(); toggleDataMenu();" class="w-full text-left px-4 py-3 text-sm hover:bg-slate-50 border-b border-slate-100 flex items-center gap-3">
                            <i class="fa-solid fa-download text-brand"></i> <span id="lblSave">Simpan JSON</span>
                        </button>
                        <button onclick="document.getElementById('fileInput').click(); toggleDataMenu();" class="w-full text-left px-4 py-3 text-sm hover:bg-slate-50 border-b border-slate-100 flex items-center gap-3">
                            <i class="fa-solid fa-upload text-warning"></i> <span id="lblLoad">Muat JSON</span>
                        </button>
                        <button onclick="shareData(); toggleDataMenu();" class="w-full text-left px-4 py-3 text-sm hover:bg-slate-50 flex items-center gap-3">
                            <i class="fa-brands fa-bluetooth text-blue-500"></i> <span id="lblShare">Share / Bluetooth</span>
                        </button>
                    </div>
                </div>
                <input type="file" id="fileInput" accept=".json" class="hidden" onchange="importData(event)">
            </div>
        </header>

        <!-- Content Area -->
        <div class="p-5 flex-grow flex flex-col bg-surface" id="mainContent">
            <!-- Rendered by JS -->
        </div>

    </main>

    <!-- Modal: Add Vehicle -->
    <div id="addVehicleModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 modal-inactive transition-all duration-300 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-2xl p-6 border border-slate-200 shadow-2xl modal-content-inactive transition-transform duration-300">
            <h3 class="text-xl font-bold mb-1 text-slate-900" id="mAddTitle">Tambah Kendaraan</h3>
            <p class="text-sm text-slate-500 mb-5" id="mAddDesc">Masukkan data awal kendaraan Anda.</p>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1" id="lblType">Tipe Kendaraan</label>
                    <select id="vType" class="w-full bg-slate-50 border border-slate-300 rounded-xl py-2.5 px-3 text-slate-900 focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand">
                        <option value="motor">Sepeda Motor</option>
                        <option value="mobil">Mobil</option>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1" id="lblBrand">Merek</label>
                        <input type="text" id="vBrand" placeholder="Honda" class="w-full bg-slate-50 border border-slate-300 rounded-xl py-2.5 px-3 text-slate-900 focus:outline-none focus:border-brand">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1" id="lblModel">Model</label>
                        <input type="text" id="vModel" placeholder="Beat / NMAX" class="w-full bg-slate-50 border border-slate-300 rounded-xl py-2.5 px-3 text-slate-900 focus:outline-none focus:border-brand">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1" id="lblOdo">Odometer Saat Ini (KM)</label>
                    <input type="number" id="vOdo" placeholder="0" class="w-full bg-slate-50 border border-slate-300 rounded-xl py-2.5 px-3 text-slate-900 focus:outline-none focus:border-brand font-mono">
                </div>
            </div>

            <div class="flex gap-3 mt-6">
                <button onclick="closeModal('addVehicleModal')" class="flex-1 bg-white border border-slate-300 hover:bg-slate-50 py-2.5 rounded-xl font-medium transition text-slate-700" id="btnCancelAdd">Batal</button>
                <button onclick="saveNewVehicle()" class="flex-1 bg-brand hover:bg-brandHover text-white py-2.5 rounded-xl font-medium transition shadow-lg shadow-blue-500/30" id="btnSaveAdd">Simpan</button>
            </div>
        </div>
    </div>

    <!-- Modal: Add Trip -->
    <div id="tripModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 modal-inactive transition-all duration-300 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-2xl p-6 border border-slate-200 shadow-2xl modal-content-inactive transition-transform duration-300">
            <h3 class="text-xl font-bold mb-1 text-slate-900" id="mTripTitle">Catat Perjalanan</h3>
            <p class="text-sm text-slate-500 mb-6" id="mTripDesc">Tambahkan jarak tempuh baru.</p>
            
            <div class="mb-6">
                <label class="block text-sm font-medium text-slate-600 mb-2" id="lblTripInput">Jarak Tempuh (KM)</label>
                <div class="relative">
                    <input type="number" id="tripDistance" placeholder="45" class="w-full bg-slate-50 border border-slate-300 rounded-xl py-3 px-4 text-slate-900 focus:outline-none focus:border-brand transition font-mono text-lg">
                    <div class="absolute inset-y-0 right-0 flex items-center pr-4 pointer-events-none text-slate-400 font-mono">KM</div>
                </div>
            </div>

            <div class="flex gap-3">
                <button onclick="closeModal('tripModal')" class="flex-1 bg-white border border-slate-300 hover:bg-slate-50 py-3 rounded-xl font-medium transition text-slate-700" id="btnCancelTrip">Batal</button>
                <button onclick="saveTrip()" class="flex-1 bg-brand hover:bg-brandHover text-white py-3 rounded-xl font-medium transition shadow-lg shadow-blue-500/30" id="btnSaveTrip">Simpan</button>
            </div>
        </div>
    </div>

    <!-- Modal: Checklist / Service Recommendation (NEW FEATURE) -->
    <div id="recommendationModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[55] modal-inactive transition-all duration-300 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-2xl p-6 border border-slate-200 shadow-2xl modal-content-inactive transition-transform duration-300">
            <div class="flex items-center gap-3 mb-2 text-warning">
                <i class="fa-solid fa-triangle-exclamation text-3xl"></i>
                <h3 class="text-xl font-bold text-slate-900" id="mRecTitle">Peringatan Servis</h3>
            </div>
            <p class="text-sm text-slate-500 mb-5" id="mRecDesc">Komponen berikut perlu segera diganti berdasarkan jarak tempuh terbaru:</p>
            
            <!-- Dynamic Checklist Container -->
            <div id="recList" class="space-y-3 mb-6 max-h-60 overflow-y-auto pr-2">
                <!-- Rendered by JS -->
            </div>

            <div class="flex gap-3">
                <button onclick="closeModal('recommendationModal')" class="w-full bg-slate-100 border border-slate-200 hover:bg-slate-200 text-slate-700 py-3 rounded-xl font-semibold transition" id="btnRecClose">Tutup & Cek Nanti</button>
            </div>
        </div>
    </div>

    <!-- Modal: Replace Component -->
    <div id="replaceModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[60] modal-inactive transition-all duration-300 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-2xl p-6 border border-slate-200 shadow-2xl modal-content-inactive transition-transform duration-300">
            <div class="flex items-center justify-between mb-1">
                <h3 class="text-xl font-bold text-slate-900" id="mReplaceTitle">Servis / Ganti</h3>
                <i class="fa-solid fa-wrench text-slate-400"></i>
            </div>
            <p class="text-sm text-slate-500 mb-5" id="mReplaceDesc">Catat penggantian suku cadang baru.</p>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1" id="lblRepQuality">Kualitas / Tipe (Otomatis Ubah KM)</label>
                    <select id="repSelect" class="w-full bg-slate-50 border border-slate-300 rounded-xl py-2.5 px-3 text-slate-900 focus:outline-none focus:border-brand">
                        <!-- Options filled via JS -->
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1" id="lblRepNote">Merek / Spesifikasi (Opsional)</label>
                    <input type="text" id="repNote" placeholder="Misal: Motul 10W-40 / Bimoli" class="w-full bg-slate-50 border border-slate-300 rounded-xl py-2.5 px-3 text-slate-900 focus:outline-none focus:border-brand">
                </div>
            </div>

            <div class="flex gap-3 mt-6">
                <button onclick="closeModal('replaceModal')" class="flex-1 bg-white border border-slate-300 hover:bg-slate-50 py-2.5 rounded-xl font-medium transition text-slate-700" id="btnCancelRep">Batal</button>
                <button onclick="saveReplacement()" class="flex-1 bg-success hover:bg-emerald-600 text-white py-2.5 rounded-xl font-medium transition shadow-lg shadow-emerald-500/30" id="btnSaveRep">Simpan Penggantian</button>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed top-5 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-full shadow-2xl font-medium text-sm flex items-center gap-2 opacity-0 pointer-events-none transition-all duration-300 z-[70] translate-y-[-20px]">
        <i class="fa-solid fa-circle-check text-success"></i>
        <span id="toastMsg">Notifikasi</span>
    </div>

        // --- APP STATE ---
        let appData = {
            lang: 'id',
            activeVehicleIndex: 0,
            vehicles: []

        let currentReplaceCompId = null;

        function initApp() {
            applyLangText();
            renderMain();
        }

        const t = (key) => i18n[appData.lang][key];

        function toggleLang() {
            appData.lang = appData.lang === 'id' ? 'en' : 'id';
            document.getElementById('btnLang').innerText = appData.lang === 'id' ? 'EN' : 'ID';
            applyLangText();
            renderMain();
        }

        function applyLangText() {
            document.getElementById('lblSubtitle').innerText = t('subtitle');

            document.getElementById('btnCancelTrip').innerText = t('btnCancel');
            document.getElementById('btnSaveTrip').innerText = t('btnSave');

            // Replace Modal
            document.getElementById('mReplaceTitle').innerText = t('mReplaceTitle');
            document.getElementById('mReplaceDesc').innerText = t('mReplaceDesc');
            document.getElementById('lblRepQuality').innerText = t('lblRepQuality');
            document.getElementById('lblRepNote').innerText = t('lblRepNote');
            document.getElementById('btnCancelRep').innerText = t('btnCancel');
            document.getElementById('btnSaveRep').innerText = t('btnSave');

            // Recommendation Modal
            if(document.getElementById('mRecTitle')) {
                document.getElementById('mRecTitle').innerText = t('mRecTitle');
                document.getElementById('mRecDesc').innerText = t('mRecDesc');
                document.getElementById('btnRecClose').innerText = t('btnRecClose');
            }

            // Dropdown
            document.getElementById('lblSave').innerText = t('lblSave');
            document.getElementById('lblLoad').innerText = t('lblLoad');
            document.getElementById('lblShare').innerText = t('lblShare');

            const typeSelect = document.getElementById('vType');
            typeSelect.options[0].text = t('typeMotor');
            typeSelect.options[1].text = t('typeCar');
        }

        function renderMain() {
            const container = document.getElementById('mainContent');
            if (appData.vehicles.length === 0) {
                // RENDER EMPTY STATE
                container.innerHTML = `
                    <div class="flex-grow flex flex-col items-center justify-center text-center px-4 h-full">
                        <div class="w-24 h-24 bg-white border border-slate-200 rounded-full flex items-center justify-center mb-6 shadow-sm">
                            <i class="fa-solid fa-car-side text-4xl text-slate-400"></i>
                        </div>
                        <h2 class="text-2xl font-bold mb-2 text-slate-800">${t('emptyTitle')}</h2>
                        <p class="text-slate-500 mb-8 max-w-xs">${t('emptyDesc')}</p>
                        <button onclick="openModal('addVehicleModal')" class="bg-brand hover:bg-brandHover text-white px-6 py-3 rounded-xl font-semibold transition shadow-lg shadow-blue-500/30">
                        ${t('btnAdd')}
                    </button>
                </div>
            `;
        } else {
            // RENDER DASHBOARD
            
            // -- VEHICLE SELECTOR TABS --
            let vehicleTabs = '<div class="flex overflow-x-auto gap-2 pb-2 mb-4 hide-scrollbar w-full">';
            appData.vehicles.forEach((v, index) => {
                const isActive = index === appData.activeVehicleIndex;
                const btnClass = isActive 
                    ? 'bg-brand text-white shadow-md shadow-blue-500/20' 
                    : 'bg-white border border-slate-200 text-slate-600 hover:bg-slate-50';
                vehicleTabs += `<button onclick="switchVehicle(${index})" class="px-4 py-2 rounded-full whitespace-nowrap text-sm font-semibold transition flex-shrink-0 ${btnClass}">${v.brand} ${v.model}</button>`;
            });
            vehicleTabs += `<button onclick="openModal('addVehicleModal')" class="px-4 py-2 rounded-full whitespace-nowrap text-sm font-medium border-2 border-dashed border-slate-300 text-slate-500 hover:bg-slate-50 hover:border-brand hover:text-brand transition flex-shrink-0 flex items-center gap-1"><i class="fa-solid fa-plus"></i></button>`;
            vehicleTabs += '</div>';

            const vehicle = appData.vehicles[appData.activeVehicleIndex];
            
            let compsHtml = '';
                vehicle.components.forEach(comp => {
                    const usage = vehicle.odometer - comp.lastChangedAt;
                    let progressPercent = (usage / comp.interval) * 100;
                    if (progressPercent > 100) progressPercent = 100;
                    
                    const remainingKm = comp.interval - usage;
                    const isOverdue = remainingKm <= 0;
                    
                    let barColor = 'bg-success';
                    let statusText = t('statusGood');
                    let statusColor = 'text-success';

                    if (progressPercent >= 90) {
                        barColor = 'bg-danger';
                        statusText = t('statusCrit');
                        statusColor = 'text-danger';
                    } else if (progressPercent >= 70) {
                        barColor = 'bg-warning';
                        statusText = t('statusWarn');
                        statusColor = 'text-warning';
                    }

                    const compName = appData.lang === 'id' ? comp.nameId : comp.nameEn;
                    const prefix = isOverdue ? t('over') : t('left');
                    const valColor = isOverdue ? 'text-danger' : 'text-slate-700';

                    compsHtml += `
                        <div class="bg-white rounded-xl p-4 border border-slate-200 shadow-sm relative overflow-hidden">
                            <div class="flex justify-between items-start mb-3">
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 rounded-lg bg-slate-50 flex items-center justify-center text-slate-500 border border-slate-100">
                                        <i class="fa-solid ${comp.icon} text-lg"></i>
                                    </div>
                                    <div>
                                        <h4 class="font-semibold text-slate-800 text-sm">${compName}</h4>
                                        <p class="text-[10px] text-slate-400 max-w-[150px] truncate" title="${comp.spec}">${comp.spec}</p>
                                    </div>
                                </div>
                                <button onclick="openReplaceModal('${comp.id}')" class="w-8 h-8 rounded-full bg-slate-50 hover:bg-slate-100 flex items-center justify-center text-slate-400 hover:text-brand transition border border-slate-200" title="Ganti / Servis">
                                    <i class="fa-solid fa-wrench text-xs"></i>
                                </button>
                            </div>

                            <div class="mt-4">
                                <div class="flex justify-between text-xs mb-1.5 font-medium">
                                    <span class="${statusColor}">${statusText}</span>
                                    <span class="font-mono text-slate-500">
                                        ${prefix} <span class="${valColor}">${Math.abs(remainingKm).toLocaleString('id-ID')} KM</span>
                                    </span>
                                </div>
                                <div class="h-2.5 w-full bg-slate-100 rounded-full overflow-hidden">
                                    <div class="h-full ${barColor} progress-bar-fill rounded-full" style="width: 0%" data-target-width="${progressPercent}%"></div>
                                </div>
                                <div class="flex justify-between text-[10px] text-slate-400 mt-1 font-mono">
                                    <span>0</span>
                                    <span>Max: ${comp.interval.toLocaleString('id-ID')}</span>
                                </div>
                            </div>
                        </div>
                    `;
                });

            container.innerHTML = `
                ${vehicleTabs}
                <!-- Vehicle Card -->
                <div class="bg-gradient-to-br from-white to-slate-50 rounded-2xl p-5 border border-slate-200 shadow-md relative overflow-hidden mb-6">
                    <div class="absolute -right-4 -top-4 text-slate-100 opacity-80">
                            <i class="fa-solid ${vehicle.type === 'mobil' ? 'fa-car' : 'fa-motorcycle'} text-9xl"></i>
                        </div>
                        
                        <div class="relative z-10">
                            <span class="px-3 py-1 bg-blue-50 text-blue-600 text-xs font-semibold rounded-full border border-blue-100">
                                ${t('activeBadge')}
                            </span>
                            <div class="flex justify-between items-start mt-3 mb-6">
                                <div>
                                    <h2 class="text-2xl font-bold mb-0 text-slate-900">${vehicle.brand}</h2>
                                    <p class="text-lg text-slate-600">${vehicle.model}</p>
                                </div>
                            </div>

                            <div class="bg-white/70 rounded-xl p-4 flex justify-between items-end border border-slate-100 shadow-sm backdrop-blur-sm">
                                <div>
                                    <p class="text-[10px] text-slate-500 mb-1 uppercase tracking-wider font-semibold">${t('totalOdo')}</p>
                                    <div class="flex items-baseline gap-1">
                                        <span class="text-3xl font-mono font-bold text-slate-800">${vehicle.odometer.toLocaleString('id-ID')}</span>
                                        <span class="text-sm text-slate-400 font-mono">KM</span>
                                    </div>
                                </div>
                                <button onclick="openModal('tripModal')" class="bg-brand hover:bg-brandHover text-white px-4 py-2 rounded-lg text-sm font-medium transition shadow-lg shadow-blue-500/30 flex items-center gap-2">
                                    ${t('btnTrip')}
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Components Grid -->
                    <div>
                        <div class="flex justify-between items-end mb-4 px-1">
                            <h3 class="text-lg font-bold text-slate-800"><i class="fa-solid fa-layer-group mr-2 text-slate-400"></i>${t('statusTitle')}</h3>
                            <span class="text-[10px] text-slate-400 uppercase tracking-wide font-semibold">${t('statusDesc')}</span>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            ${compsHtml}
                        </div>
                    </div>
                `;

                // Animate bars
                setTimeout(() => {
                    document.querySelectorAll('.progress-bar-fill').forEach(bar => {
                        bar.style.width = bar.getAttribute('data-target-width');
                    });
                }, 50);
            }
        }

        // --- NEW FEATURE: SERVICE RECOMMENDATION SYSTEM ---
        function checkRecommendations() {
            const vehicle = appData.vehicles[appData.activeVehicleIndex];
            const listContainer = document.getElementById('recList');
            listContainer.innerHTML = '';
            let needsWarning = false;

            vehicle.components.forEach(comp => {
                const usage = vehicle.odometer - comp.lastChangedAt;
                let progressPercent = (usage / comp.interval) * 100;
                
                // Trigger warning if component usage is 90% or more
                if (progressPercent >= 90) {
                    needsWarning = true;
                    const compName = appData.lang === 'id' ? comp.nameId : comp.nameEn;
                    const remainingKm = comp.interval - usage;
                    const isOver = remainingKm <= 0;
                    
                    // Format text safely
                    const statusText = isOver 
                                     ? `${t('over')} ${Math.abs(remainingKm).toLocaleString('id-ID')} KM`
                                     : `${t('left')} ${remainingKm.toLocaleString('id-ID')} KM`;
                    const textColor = isOver ? 'text-danger' : 'text-warning';
                    const iconColor = isOver ? 'text-danger' : 'text-warning';

                    listContainer.innerHTML += `
                        <div class="flex justify-between items-center p-3 bg-slate-50 border border-slate-100 rounded-xl">
                            <div class="flex items-center gap-3">
                                <div class="w-8 h-8 rounded-full bg-white border border-slate-200 flex items-center justify-center ${iconColor}">
                                    <i class="fa-solid ${comp.icon} text-sm"></i>
                                </div>
                                <div>
                                    <p class="text-sm font-bold text-slate-800">${compName}</p>
                                    <p class="text-[10px] font-mono font-medium ${textColor}">${statusText}</p>
                                </div>
                            </div>
                            <button onclick="closeModal('recommendationModal'); setTimeout(() => openReplaceModal('${comp.id}'), 350);" class="px-4 py-2 bg-brand hover:bg-brandHover text-white text-xs font-semibold rounded-lg transition shadow-sm shadow-blue-500/20">
                                ${t('btnRecFix')}
                            </button>
                        </div>
                    `;
                }
            });

            if (needsWarning) {
            // Wait slightly for Trip Modal to fully close before opening Recommendation Modal
            setTimeout(() => {
                openModal('recommendationModal');
            }, 400); 
        }
    }

    function switchVehicle(index) {
        appData.activeVehicleIndex = index;
        renderMain();
    }

    function saveNewVehicle() {
        const brand = document.getElementById('vBrand').value || 'Brand';
            const model = document.getElementById('vModel').value || 'Model';
            const type = document.getElementById('vType').value;
            const odo = parseInt(document.getElementById('vOdo').value) || 0;

            const comps = JSON.parse(JSON.stringify(defaultComponents[type]));
            comps.forEach(c => c.lastChangedAt = odo);

            const newVehicle = {
                id: 'v_' + Date.now(),
                brand, model, type, odometer: odo, components: comps
            };

            appData.vehicles.push(newVehicle);
            appData.activeVehicleIndex = appData.vehicles.length - 1;

            closeModal('addVehicleModal');
            document.getElementById('vBrand').value = '';
            document.getElementById('vModel').value = '';
            document.getElementById('vOdo').value = '';
            
            renderMain();
            showToast("Kendaraan ditambahkan!");
        }

        function saveTrip() {
            const val = parseFloat(document.getElementById('tripDistance').value);
            if (!val || val <= 0) return;

            appData.vehicles[appData.activeVehicleIndex].odometer += val;
            closeModal('tripModal');
            document.getElementById('tripDistance').value = '';
            
            renderMain();
            showToast(t('msgTripSaved'));

            // Run Recommendation Check after adding trip
            checkRecommendations();
        }

        function openReplaceModal(compId) {
            currentReplaceCompId = compId;
            const vehicle = appData.vehicles[appData.activeVehicleIndex];
            const comp = vehicle.components.find(c => c.id === compId);
            
            // Populate select options based on type
            const sel = document.getElementById('repSelect');
            sel.innerHTML = '';
            
            const optionsDb = intervalDatabase[vehicle.type][comp.typeKey];
            
            optionsDb.forEach(opt => {
                const label = appData.lang === 'id' ? opt.labelId : opt.labelEn;
                const optEl = document.createElement('option');
                optEl.value = opt.km;
                optEl.text = `${label} (± ${opt.km.toLocaleString('id-ID')} KM)`;
                // auto-select current interval if match
                if (comp.interval === opt.km) optEl.selected = true;
                sel.appendChild(optEl);
            });

            document.getElementById('repNote').value = '';
            openModal('replaceModal');
        }

        function saveReplacement() {
            if(!currentReplaceCompId) return;

            const vehicle = appData.vehicles[appData.activeVehicleIndex];
            const comp = vehicle.components.find(c => c.id === currentReplaceCompId);
            
            const sel = document.getElementById('repSelect');
            const noteInput = document.getElementById('repNote').value.trim();
            
            // Extract label without the " (± XXX KM)" part for display
            const rawLabelText = sel.options[sel.selectedIndex].text.split(' (')[0];

            comp.interval = parseInt(sel.value);
            comp.lastChangedAt = vehicle.odometer;
            comp.spec = noteInput !== "" ? noteInput : rawLabelText;

            closeModal('replaceModal');
            renderMain();
            showToast(t('msgReplaced'));
        }

        // --- DATA MANAGEMENT ---
        function toggleDataMenu() {
            const menu = document.getElementById('dataMenu');
            menu.classList.toggle('hidden');
        }

        function exportData() {
            const dataStr = JSON.stringify(appData);
            const blob = new Blob([dataStr], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = `AutoTrack_Backup_${Date.now()}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if (parsed && Array.isArray(parsed.vehicles)) {
                        appData = parsed;
                        applyLangText();
                        renderMain();
                        showToast(t('msgImportOk'));
                    } else { throw new Error('Format Invalid'); }
                } catch (err) {
                    showToast(t('msgImportErr'));
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        function shareData() {
            const dataStr = JSON.stringify(appData);
            const file = new File([dataStr], "AutoTrack_Data.json", { type: "application/json" });

            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                navigator.share({
                    title: 'AutoTrack Backup',
                    text: 'Data perawatan kendaraan saya (AutoTrack Pro)',
                    files: [file]
                }).then(() => showToast(t('msgShareOk')))
                  .catch(() => {}); 
            } else {
                showToast(t('msgShareErr'));
            }
        }

        // --- UTILS ---
        function openModal(id) {
            const modal = document.getElementById(id);
            const content = modal.querySelector('div');
            modal.classList.remove('modal-inactive');
            modal.classList.add('modal-active');
            setTimeout(() => {
                content.classList.remove('modal-content-inactive');
                content.classList.add('modal-content-active');
            }, 10);
        }

        function closeModal(id) {
            const modal = document.getElementById(id);
            const content = modal.querySelector('div');
            content.classList.remove('modal-content-active');
            content.classList.add('modal-content-inactive');
            setTimeout(() => {
                modal.classList.remove('modal-active');
                modal.classList.add('modal-inactive');
            }, 300);
        }

        let toastTimeout;
        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            
            toast.classList.remove('opacity-0', 'translate-y-[-20px]', 'pointer-events-none');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-[-20px]', 'pointer-events-none');
            }, 3000);
        }

        // Initialize
        window.onload = initApp;

    </script>
</body>
</html>
